<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RimWorld Character Editor (Responsive Edition)</title>
  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #181b20;
      --accent-color: #d97706;
      --accent-hover: #b45309;
      --border-color: #2b303b;
      --text-color: #e2e8f0;
      --text-muted: #94a3b8;
      --input-bg: #0b0c0e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding: 10px;
    }

    .container { max-width: 1200px; margin: 0 auto; width: 100%; }

    header {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 { font-size: 1.2rem; color: var(--accent-color); font-weight: bold; }

    .char-manager {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--input-bg);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      flex-wrap: wrap;
    }

    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.8rem;
      transition: background 0.2s;
      white-space: nowrap;
    }
    button:hover { background-color: var(--accent-hover); }
    button.secondary { background-color: #334155; }
    button.secondary:hover { background-color: #475569; }
    button.danger { background-color: #991b1b; }
    button.danger:hover { background-color: #7f1d1d; }
    button.cloud { background-color: #047857; }
    button.cloud:hover { background-color: #065f46; }

    /* レスポンシブ対応のグリッド */
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
    .grid-5 { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
    
    .grid-profile { 
      display: grid; 
      grid-template-columns: 160px 1fr; 
      gap: 15px; 
    }
    @media (max-width: 768px) {
      .grid-profile { grid-template-columns: 1fr; }
      .avatar-box { margin: 0 auto; }
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 0.95rem;
      color: var(--accent-color);
      margin-bottom: 10px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }

    label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 3px; }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 7px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-color); }
    
    textarea { resize: vertical; min-height: 100px; line-height: 1.5; }
    .memo-textarea { min-height: 180px !important; }

    .avatar-box {
      width: 140px;
      height: 170px;
      border: 2px dashed var(--border-color);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--input-bg);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-placeholder { text-align: center; color: var(--text-muted); font-size: 0.75rem; }

    /* --- スキルUI --- */
    .skill-list { display: flex; flex-direction: column; gap: 5px; margin-top: 4px; }
    .skill-row {
      display: flex;
      align-items: center;
      height: 26px;
      font-size: 0.85rem;
      user-select: none;
      gap: 4px;
    }
    .skill-label-box {
      width: 85px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .skill-name-str { font-weight: bold; font-size: 0.85rem; }
    .passion-fire { cursor: pointer; font-size: 0.95rem; }
    .fire-0 { opacity: 0.1; filter: grayscale(100%); }
    .fire-1 { opacity: 0.9; filter: drop-shadow(0 0 2px #f97316); }
    .fire-2 { opacity: 1; filter: drop-shadow(0 0 5px #ef4444); }

    .skill-bar-container {
      position: relative;
      flex: 1;
      min-width: 80px;
      height: 22px;
      background: #111417;
      border: 1px solid #232730;
      border-radius: 2px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }
    .skill-bar-bg-dark {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      background: #3e4452;
      z-index: 1;
      transition: width 0.15s;
    }
    .skill-bar-bg-green {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      background: #2e6034;
      z-index: 2;
      transition: width 0.15s;
    }
    .skill-val-num {
      position: relative;
      z-index: 3;
      padding-left: 6px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 3px #000;
      font-size: 0.85rem;
    }
    .skill-rank-desc {
      font-size: 0.7rem;
      color: var(--text-muted);
      width: 85px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }

    .skill-btn-step {
      width: 20px;
      height: 22px;
      background: #252a34;
      border: 1px solid #3b4252;
      color: #e2e8f0;
      font-weight: bold;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      flex-shrink: 0;
    }
    .skill-btn-step:hover { background: #3b4252; }

    .skill-btn-random {
      padding: 2px 4px;
      height: 22px;
      background: #334155;
      border: 1px solid #475569;
      color: #fff;
      font-size: 0.7rem;
      border-radius: 3px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .skill-btn-random:hover { background: #475569; }

    .incapable-box {
      background: #2a1215;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      margin-top: 8px;
    }

    .trait-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
    .trait-desc-box {
      font-size: 0.75rem;
      color: #a1a1aa;
      background: var(--input-bg);
      padding: 8px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      min-height: 38px;
    }
    
    .sync-status {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 4px;
      text-align: right;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>RimWorld Character Editor</h1>
    
    <div class="char-manager">
      <label style="margin:0;">キャラ:</label>
      <select id="charSelect" onchange="switchCharacter()" style="width: 120px;"></select>
      <button class="secondary" onclick="createNewCharacter()">＋新</button>
      <button class="danger" onclick="deleteCurrentCharacter()">削除</button>
    </div>

    <div class="btn-group">
      <button class="cloud" onclick="syncWithGitHub()">☁️ 保存</button>
      <button class="secondary" onclick="toggleConfigModal()">⚙️ 設定</button>
      <button onclick="randomizeAllSkills()">🎲 一括ランダム</button>
      <button onclick="copyAIPrompt()">🤖 コピー</button>
    </div>
  </header>
  <div id="syncStatus" class="sync-status">同期状態: ローカル保存のみ</div>

  <div class="card" id="githubConfigCard" style="display: none; border-color: var(--accent-color);">
    <div class="card-title">⚙️ GitHub同期・保存設定</div>
    <div class="grid-3" style="margin-bottom: 10px;">
      <div>
        <label>GitHub ユーザー名</label>
        <input type="text" id="ghUser" placeholder="例: wozgrey">
      </div>
      <div>
        <label>リポジトリ名</label>
        <input type="text" id="ghRepo" placeholder="例: rimmaker">
      </div>
      <div>
        <label>アクセストークン (PAT)</label>
        <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx">
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
      <span style="font-size: 0.75rem; color: var(--text-muted);">Contents(Read and write)権限付きトークンを入力してください。</span>
      <button onclick="saveGitHubConfig()">設定を保存して読込</button>
    </div>
  </div>

  <!-- 1. 基本プロフィール & 画像 -->
  <div class="card">
    <div class="card-title">1. 基本プロフィール (Identity & Faction)</div>
    <div class="grid-profile">
      <div>
        <label>キャラクター画像</label>
        <div class="avatar-box" onclick="document.getElementById('avatarInput').click()">
          <div id="avatarPlaceholder" class="avatar-placeholder">クリックして<br>画像を選択</div>
          <img id="avatarImg" style="display:none;">
        </div>
        <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="handleImageUpload(this)">
      </div>

      <div>
        <div class="grid-3" style="margin-bottom: 8px;">
          <div>
            <label>姓 (Last Name)</label>
            <input type="text" id="lastName" placeholder="例: 霧雨">
            <input type="text" id="lastNameKana" placeholder="ふりがな" style="margin-top:3px; font-size:0.75rem;">
          </div>
          <div>
            <label>名 (First Name)</label>
            <input type="text" id="firstName" placeholder="例: 灰">
            <input type="text" id="firstNameKana" placeholder="ふりがな" style="margin-top:3px; font-size:0.75rem;">
          </div>
          <div>
            <label>ニックネーム</label>
            <input type="text" id="nickname" placeholder="例: カイ">
          </div>
        </div>

        <div class="grid-5" style="margin-bottom: 8px;">
          <div><label>種族</label><input type="text" id="race" placeholder="例: 人間 / イースキン"></div>
          <div><label>性別</label><select id="gender"><option value="">未選択</option><option>男</option><option>女</option><option>その他</option></select></div>
          <div><label>年齢</label><input type="number" id="age" placeholder="20"></div>
          <div><label>クロノ年齢</label><input type="number" id="chronoAge" placeholder="20"></div>
          <div><label>役割</label><input type="text" id="role" placeholder="リーダー"></div>
        </div>

        <div class="grid-2" style="margin-bottom: 8px;">
          <div>
            <label>所属派閥</label>
            <select id="factionSelect" onchange="onFactionSelectChange()"></select>
            <input type="text" id="factionCustom" placeholder="派閥名を直接入力..." style="display:none; margin-top:3px;">
          </div>
          <div>
            <label>信奉思想</label>
            <input type="text" id="ideology" placeholder="例: 地球的人道主義">
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label>幼少期</label>
            <select id="childhood" onchange="onBackstoryChange('childhood')"></select>
            <input type="text" id="childhoodCustom" placeholder="自由入力..." style="display:none; margin-top:3px;">
          </div>
          <div>
            <label>成年期</label>
            <select id="adulthood" onchange="onBackstoryChange('adulthood')"></select>
            <input type="text" id="adulthoodCustom" placeholder="自由入力..." style="display:none; margin-top:3px;">
          </div>
        </div>
        <div id="incapableDisplay" class="incapable-box" style="display:none;">
          ⚠️ 不能作業・欠点: <span id="incapableList">なし</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. スキル & 才能 -->
  <div class="grid-2">
    <div class="card">
      <div class="card-title">
        2. スキル
        <button class="secondary" style="padding: 2px 6px; font-size: 0.7rem;" onclick="randomizeAllSkills()">🎲 一括ランダム</button>
      </div>
      <div class="skill-list" id="skillListContainer"></div>
    </div>

    <div class="card">
      <div class="card-title">
        3. 特性・才能
        <button class="secondary" style="padding: 2px 6px; font-size: 0.7rem;" onclick="addTraitRow()">＋ 追加</button>
      </div>
      <div id="traitContainer"></div>
      <div class="trait-desc-box" id="traitDescription">選択した才能の解説を表示します</div>
    </div>
  </div>

  <!-- 3. 性格 & 内面構造 -->
  <div class="card">
    <div class="card-title">4. 性格・内面構造</div>
    <div class="grid-2" style="margin-bottom: 10px;">
      <div><label>表向きの性格（パブリック・フェイス）</label><textarea id="publicFace" placeholder="日常や初対面での印象"></textarea></div>
      <div><label>根底にある価値観・倫理観</label><textarea id="coreBelief" placeholder="命の価値や倫理基準"></textarea></div>
    </div>
    <div class="grid-3">
      <div><label>長所と短所（ギャップ）</label><textarea id="gap" placeholder="表裏一体の性質"></textarea></div>
      <div><label>自己評価・コンプレックス</label><textarea id="complex" placeholder="劣等感や不安"></textarea></div>
      <div><label>モチベーション</label><textarea id="motivation" placeholder="行動の原動力"></textarea></div>
    </div>
  </div>

  <!-- 4. 過去・背景とトラウマ -->
  <div class="card">
    <div class="card-title">5. 過去・背景とトラウマ</div>
    <div class="grid-2" style="margin-bottom: 10px;">
      <div><label>幼少期の環境</label><textarea id="childEnv" placeholder="家庭環境や教育方針"></textarea></div>
      <div><label>人生の転機</label><textarea id="turningPoint" placeholder="人生観を決定づけた出来事"></textarea></div>
    </div>
    <div class="grid-2">
      <div><label>トラウマと「心の傷」</label><textarea id="trauma" placeholder="消えない記憶"></textarea></div>
      <div><label>トリガー（感情の爆発ポイント）</label><textarea id="trigger" placeholder="過剰反応してしまう状況"></textarea></div>
    </div>
  </div>

  <!-- 5. 人間関係と「境界線」 -->
  <div class="card">
    <div class="card-title">6. 人間関係と「境界線」</div>
    <div class="grid-3">
      <div><label>仲間へのスタンス</label><textarea id="relParty" placeholder="心理的距離"></textarea></div>
      <div><label>ストレスの溜め込み方</label><textarea id="stressType" placeholder="我慢の仕方"></textarea></div>
      <div><label>衝突時の行動パターン</label><textarea id="fightPattern" placeholder="喧嘩した時の反応"></textarea></div>
    </div>
  </div>

  <!-- 6. 適応度 & 癖 -->
  <div class="card">
    <div class="card-title">7. アナーキア適応度 & 日常の癖</div>
    <div class="grid-3" style="margin-bottom: 10px;">
      <div><label>文明への執着</label><textarea id="glitterAffinity" placeholder="高度文明への未練"></textarea></div>
      <div><label>環境変化へのストレス耐性</label><textarea id="stressResist" placeholder="耐久度"></textarea></div>
      <div><label>現地イデオロギーへの反応</label><textarea id="anarchiaReaction" placeholder="狂気に対する感情"></textarea></div>
    </div>
    <div class="grid-3">
      <div><label>思考の癖</label><textarea id="habit" placeholder="無意識にとる行動"></textarea></div>
      <div><label>好きなもの / 嫌いなもの</label><textarea id="likesDislikes" placeholder="好みの食べ物など"></textarea></div>
      <div><label>人間らしい隙・弱点</label><textarea id="weakness" placeholder="不器用な部分"></textarea></div>
    </div>
  </div>

  <!-- 7. メモ欄 -->
  <div class="card">
    <div class="card-title">8. メモ欄</div>
    <textarea id="memo" class="memo-textarea" placeholder="その他補足設定など..."></textarea>
  </div>
</div>

<script>

}

const FILE_PATH = "rimworld_data.json";

async function loadFromGitHub(isStartup = false) {
  if (!ghConfig.user || !ghConfig.repo || !ghConfig.token) {
    if (!isStartup) alert("GitHubの設定を入力してください。");
    return;
  }

  const url = `https://api.github.com/repos/${ghConfig.user}/${ghConfig.repo}/contents/${FILE_PATH}`;
  document.getElementById("syncStatus").innerText = "同期状態: 読込中...";

  try {
    const res = await fetch(url, {
      headers: {
        "Authorization": `token ${ghConfig.token}`,
        "Accept": "application/vnd.github.v3+json"
      }
    });

    if (res.status === 404) {
      document.getElementById("syncStatus").innerText = "同期状態: 新規ファイル作成予定";
      loadAllCharactersFromStorage();
      return;
    }

    if (!res.ok) throw new Error("データ取得に失敗しました。");

    const data = await res.json();
    const jsonString = decodeURIComponent(escape(atob(data.content)));
    characters = JSON.parse(jsonString);

    refreshCharSelect();
    updateFactionSelectOptions();

    const keys = Object.keys(characters);
    if (keys.length > 0) {
      currentId = keys[0];
      document.getElementById("charSelect").value = currentId;
      applyData(characters[currentId]);
    }

    document.getElementById("syncStatus").innerText = "同期状態: ✅ 同期完了";
    if (!isStartup) alert("☁️ クラウドからデータを読み込みました！");
  } catch (err) {
    console.error(err);
    document.getElementById("syncStatus").innerText = "同期状態: ⚠️ 読込エラー（ローカル使用）";
    loadAllCharactersFromStorage();
    if (!isStartup) alert("エラー: " + err.message);
  }
}

async function syncWithGitHub() {
  if (!ghConfig.user || !ghConfig.repo || !ghConfig.token) {
    alert("先に「⚙️ 設定」からGitHub情報を入力してください。");
    document.getElementById("githubConfigCard").style.display = "block";
    return;
  }

  autoSaveCurrent();
  const url = `https://api.github.com/repos/${ghConfig.user}/${ghConfig.repo}/contents/${FILE_PATH}`;
  document.getElementById("syncStatus").innerText = "同期状態: 保存中...";

  try {
    let sha = null;
    const getRes = await fetch(url, {
      headers: {
        "Authorization": `token ${ghConfig.token}`,
        "Accept": "application/vnd.github.v3+json"
      }
    });

    if (getRes.ok) {
      const fileData = await getRes.json();
      sha = fileData.sha;
    }

    const jsonString = JSON.stringify(characters, null, 2);
    const base64Content = btoa(unescape(encodeURIComponent(jsonString)));

    const putRes = await fetch(url, {
      method: "PUT",
      headers: {
        "Authorization": `token ${ghConfig.token}`,
        "Accept": "application/vnd.github.v3+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: "Update RimWorld character data",
        content: base64Content,
        sha: sha
      })
    });

    if (!putRes.ok) throw new Error("保存に失敗しました。設定を確認してください。");

    document.getElementById("syncStatus").innerText = "同期状態: ✅ 保存完了";
    alert("☁️ GitHubへの保存が完了しました！");
  } catch (err) {
    console.error(err);
    document.getElementById("syncStatus").innerText = "同期状態: ❌ 保存エラー";
    alert("保存エラー: " + err.message);
  }
}

function recalcBackstoryMods() {
  SKILLS.forEach(s => skillState[s].bsMod = 0);

  const cVal = document.getElementById("childhood").value;
  const aVal = document.getElementById("adulthood").value;

  const cData = BACKSTORIES_DATA.childhood[cVal] || { mods: {}, incap: "" };
  const aData = BACKSTORIES_DATA.adulthood[aVal] || { mods: {}, incap: "" };

  for (let s in cData.mods) { if (skillState[s]) skillState[s].bsMod += cData.mods[s]; }
  for (let s in aData.mods) { if (skillState[s]) skillState[s].bsMod += aData.mods[s]; }

  SKILLS.forEach(s => {
    if (skillState[s].userVal < skillState[s].bsMod) {
      skillState[s].userVal = skillState[s].bsMod;
    }
  });

  let incaps = [];
  if (cData.incap) incaps.push(cData.incap);
  if (aData.incap) incaps.push(aData.incap);

  const incapBox = document.getElementById("incapableDisplay");
  if (incaps.length > 0) {
    incapBox.style.display = "block";
    document.getElementById("incapableList").innerText = incaps.join(" / ");
  } else {
    incapBox.style.display = "none";
  }

  renderSkills();
}

function getRandomSkillValue(hasPassion) {
  const rand = Math.random() * 100;
  let baseVal = 0;

  if (rand < 40) baseVal = Math.random() < 0.6 ? 0 : 1;
  else if (rand < 75) baseVal = 2;
  else if (rand < 90) baseVal = 3;
  else if (rand < 97) baseVal = 4;
  else if (rand < 99.5) baseVal = Math.floor(Math.random() * 3) + 5;
  else if (rand < 99.9) baseVal = Math.floor(Math.random() * 4) + 8;
  else baseVal = Math.floor(Math.random() * 7) + 12;

  if (hasPassion > 0 && baseVal < 18) {
    baseVal = Math.min(18, baseVal + Math.floor(Math.random() * 3) + hasPassion);
  }

  return baseVal;
}

function randomizeSingleSkill(skill) {
  const st = skillState[skill];
  const pRand = Math.random();
  if (pRand < 0.7) st.passion = 0;
  else if (pRand < 0.9) st.passion = 1;
  else st.passion = 2;

  const rawVal = getRandomSkillValue(st.passion);
  st.userVal = Math.max(st.bsMod, rawVal);

  renderSkills();
  autoSaveCurrent();
}

function randomizeAllSkills() {
  SKILLS.forEach(s => skillState[s].passion = 0);
  const targetPtsChoices = [4, 5, 5, 6, 6, 6, 7];
  let budget = targetPtsChoices[Math.floor(Math.random() * targetPtsChoices.length)];

  let attempts = 0;
  while (budget > 0 && attempts < 100) {
    attempts++;
    const randomSkill = SKILLS[Math.floor(Math.random() * SKILLS.length)];
    const st = skillState[randomSkill];
    if (st.passion < 2) {
      st.passion += 1;
      budget -= 1;
    }
  }

  SKILLS.forEach(s => {
    const st = skillState[s];
    const rawVal = getRandomSkillValue(st.passion);
    st.userVal = Math.max(st.bsMod, rawVal);
  });

  renderSkills();
  autoSaveCurrent();
}

function togglePassion(skill) {
  skillState[skill].passion = (skillState[skill].passion + 1) % 3;
  renderSkills();
  autoSaveCurrent();
}

function stepSkill(skill, delta) {
  let st = skillState[skill];
  let cur = st.userVal;
  let minAllowed = st.bsMod;
  cur = Math.min(20, Math.max(minAllowed, cur + delta));
  st.userVal = cur;
  renderSkills();
  autoSaveCurrent();
}

function renderSkills() {
  SKILLS.forEach(s => {
    const st = skillState[s];
    const fireEl = document.getElementById(`fire-${s}`);
    if (st.passion === 0) { fireEl.innerText = "🔥🔥"; fireEl.className = "passion-fire fire-0"; }
    else if (st.passion === 1) { fireEl.innerText = "🔥"; fireEl.className = "passion-fire fire-1"; }
    else { fireEl.innerText = "🔥🔥"; fireEl.className = "passion-fire fire-2"; }

    const userVal = Math.min(20, Math.max(0, st.userVal));
    const bsMod = Math.max(0, st.bsMod);

    const greenWidthVal = Math.min(userVal, bsMod);
    const darkWidthVal = userVal;

    document.getElementById(`bar-green-${s}`).style.width = `${(greenWidthVal / 20) * 100}%`;
    document.getElementById(`bar-dark-${s}`).style.width = `${(darkWidthVal / 20) * 100}%`;

    document.getElementById(`val-num-${s}`).innerText = userVal;
    document.getElementById(`rank-desc-${s}`).innerText = SKILL_RANKS[userVal] || "神の領域";
  });
}

function initDefaultTraitRows() {
  const container = document.getElementById("traitContainer");
  container.innerHTML = "";
  for (let i = 0; i < 4; i++) addTraitRow();
}

function addTraitRow(selectedVal = 0) {
  const container = document.getElementById("traitContainer");
  const row = document.createElement("div");
  row.className = "trait-row";

  let options = "";
  TRAITS_VANILLA.forEach((t, idx) => {
    options += `<option value="${idx}" ${idx == selectedVal ? 'selected' : ''}>${t.name}</option>`;
  });

  row.innerHTML = `
    <select class="trait-select" onchange="updateTraits()">${options}</select>
    <button class="danger" style="padding: 2px 6px; font-size: 0.7rem;" onclick="removeTraitRow(this)">削除</button>
  `;
  container.appendChild(row);
  updateTraits();
}

function removeTraitRow(btn) {
  btn.parentElement.remove();
  updateTraits();
}

function updateTraits() {
  const selects = document.querySelectorAll(".trait-select");
  let descs = [];
  selects.forEach(sel => {
    const idx = sel.value;
    if (idx > 0) descs.push(`【${TRAITS_VANILLA[idx].name}】${TRAITS_VANILLA[idx].desc}`);
  });
  document.getElementById("traitDescription").innerHTML = descs.length > 0 ? descs.join("<br>") : "選択した才能の解説を表示します";
  autoSaveCurrent();
}

function handleImageUpload(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => {
      const imgData = e.target.result;
      document.getElementById("avatarImg").src = imgData;
      document.getElementById("avatarImg").style.display = "block";
      document.getElementById("avatarPlaceholder").style.display = "none";
      autoSaveCurrent();
    };
    reader.readAsDataURL(input.files[0]);
  }
}

function updateFactionSelectOptions() {
  const fSel = document.getElementById("factionSelect");
  const existingVal = fSel.value;
  fSel.innerHTML = "";

  let factions = new Set(["アナーキア不時着隊", "アナーキア奉納教団", "グリッターワールド不時着者グループ"]);
  for (let id in characters) {
    if (characters[id].faction) factions.add(characters[id].faction);
  }

  fSel.innerHTML += `<option value="直接入力 (新規入力)">直接入力 (新規入力)</option>`;
  factions.forEach(f => {
    fSel.innerHTML += `<option value="${f}">${f}</option>`;
  });

  if (factions.has(existingVal)) fSel.value = existingVal;
}

function onFactionSelectChange() {
  const fSel = document.getElementById("factionSelect");
  const customInput = document.getElementById("factionCustom");
  if (fSel.value === "直接入力 (新規入力)") {
    customInput.style.display = "block";
  } else {
    customInput.style.display = "none";
  }
  autoSaveCurrent();
}

function loadAllCharactersFromStorage() {
  const saved = localStorage.getItem("rimworld_chars_cloud_v2");
  if (saved) {
    characters = JSON.parse(saved);
  } else {
    const defaultId = "char_" + Date.now();
    characters[defaultId] = { id: defaultId, nickname: "新規キャラ1" };
  }
  refreshCharSelect();
  updateFactionSelectOptions();

  const keys = Object.keys(characters);
  if (keys.length > 0) {
    currentId = keys[0];
    document.getElementById("charSelect").value = currentId;
    applyData(characters[currentId]);
  }
}

function refreshCharSelect() {
  const sel = document.getElementById("charSelect");
  sel.innerHTML = "";
  for (let id in characters) {
    const name = characters[id].nickname || characters[id].firstName || "無題のキャラ";
    sel.innerHTML += `<option value="${id}">${name}</option>`;
  }
}

function switchCharacter() {
  autoSaveCurrent();
  currentId = document.getElementById("charSelect").value;
  if (characters[currentId]) {
    applyData(characters[currentId]);
  }
}

function createNewCharacter() {
  autoSaveCurrent();
  const newId = "char_" + Date.now();
  characters[newId] = { id: newId, nickname: "新規キャラ" };
  currentId = newId;
  refreshCharSelect();
  updateFactionSelectOptions();
  document.getElementById("charSelect").value = currentId;
  applyData(characters[currentId]);
}

function deleteCurrentCharacter() {
  if (Object.keys(characters).length <= 1) {
    alert("最後の1つのキャラクターは削除できません。");
    return;
  }
  if (confirm("現在選択中のキャラクターを削除しますか？")) {
    delete characters[currentId];
    saveAllToStorage();
    loadAllCharactersFromStorage();
  }
}

function autoSaveCurrent() {
  if (!currentId) return;
  const data = gatherFormData();
  data.id = currentId;
  characters[currentId] = data;
  saveAllToStorage();
  
  const sel = document.getElementById("charSelect");
  const opt = sel.querySelector(`option[value="${currentId}"]`);
  if (opt) opt.innerText = data.nickname || data.firstName || "無題のキャラ";
}

function saveAllToStorage() {
  localStorage.setItem("rimworld_chars_cloud_v2", JSON.stringify(characters));
}

function gatherFormData() {
  const fields = ["lastName","lastNameKana","firstName","firstNameKana","nickname","race","gender","age","chronoAge","role","ideology","childhood","childhoodCustom","adulthood","adulthoodCustom","publicFace","coreBelief","gap","complex","motivation","childEnv","turningPoint","trauma","trigger","relParty","stressType","fightPattern","glitterAffinity","stressResist","anarchiaReaction","habit","likesDislikes","weakness","memo"];
  let data = { skills: skillState, traits: [], avatar: "", faction: "" };
  fields.forEach(f => {
    const el = document.getElementById(f);
    if (el) data[f] = el.value;
  });

  const fSel = document.getElementById("factionSelect");
  data.faction = (fSel.value === "直接入力 (新規入力)") ? document.getElementById("factionCustom").value : fSel.value;

  document.querySelectorAll(".trait-select").forEach(sel => data.traits.push(sel.value));

  const img = document.getElementById("avatarImg");
  if (img.style.display !== "none") data.avatar = img.src;

  return data;
}

function applyData(data) {
  const fields = ["lastName","lastNameKana","firstName","firstNameKana","nickname","race","gender","age","chronoAge","role","ideology","childhood","childhoodCustom","adulthood","adulthoodCustom","publicFace","coreBelief","gap","complex","motivation","childEnv","turningPoint","trauma","trigger","relParty","stressType","fightPattern","glitterAffinity","stressResist","anarchiaReaction","habit","likesDislikes","weakness","memo"];
  fields.forEach(f => {
    const el = document.getElementById(f);
    if (el) el.value = data[f] !== undefined ? data[f] : "";
  });

  updateFactionSelectOptions();
  const fSel = document.getElementById("factionSelect");
  const fCustom = document.getElementById("factionCustom");
  if (data.faction && Array.from(fSel.options).some(o => o.value === data.faction)) {
    fSel.value = data.faction;
    fCustom.style.display = "none";
  } else if (data.faction) {
    fSel.value = "直接入力 (新規入力)";
    fCustom.value = data.faction;
    fCustom.style.display = "block";
  } else {
    fSel.value = "直接入力 (新規入力)";
    fCustom.value = "";
    fCustom.style.display = "block";
  }

  if (data.skills) {
    skillState = data.skills;
  } else {
    SKILLS.forEach(s => skillState[s] = { userVal: 0, bsMod: 0, passion: 0 });
  }

  if (data.traits && data.traits.length > 0) {
    const container = document.getElementById("traitContainer");
    container.innerHTML = "";
    data.traits.forEach(val => addTraitRow(val));
  } else {
    initDefaultTraitRows();
  }

  const img = document.getElementById("avatarImg");
  const placeholder = document.getElementById("avatarPlaceholder");
  if (data.avatar) {
    img.src = data.avatar;
    img.style.display = "block";
    placeholder.style.display = "none";
  } else {
    img.src = "";
    img.style.display = "none";
    placeholder.style.display = "block";
  }

  onBackstoryChange('childhood');
  onBackstoryChange('adulthood');
  updateTraits();
}

function copyAIPrompt() {
  const getVal = id => document.getElementById(id).value;
  const getBS = type => {
    const val = getVal(type);
    return val === "直接入力 (カスタム)" ? getVal(type + "Custom") : val;
  };

  const fSel = document.getElementById("factionSelect");
  const factionVal = (fSel.value === "直接入力 (新規入力)") ? getVal("factionCustom") : fSel.value;

  let traitsText = [];
  document.querySelectorAll(".trait-select").forEach(sel => {
    if (sel.value > 0) traitsText.push(TRAITS_VANILLA[sel.value].name);
  });

  let skillsText = [];
  SKILLS.forEach(s => {
    const fire = ["", "★", "★★"][skillState[s].passion];
    const total = Math.min(20, skillState[s].userVal);
    if (total > 0 || fire) skillsText.push(`${s}:${total}${fire}`);
  });

  const prompt = `
# キャラクター設定: ${getVal("lastName")} ${getVal("firstName")} (${getVal("nickname")})

## 1. 基本情報
- 氏名: ${getVal("lastName")} (${getVal("lastNameKana")}) ${getVal("firstName")} (${getVal("firstNameKana")}) [呼び名: ${getVal("nickname")}]
- 種族: ${getVal("race") || "人間"} / 性別: ${getVal("gender") || "未設定"} / 年齢: ${getVal("age") || "未設定"}歳 (クロノ年齢: ${getVal("chronoAge") || "未設定"}歳)
- 役割: ${getVal("role")} / 所属派閥: ${factionVal || "無所属"} / 思想: ${getVal("ideology")}
- 生い立ち: 幼少期[${getBS("childhood")}] / 成年期[${getBS("adulthood")}]
- 才能・特性: ${traitsText.join(", ") || "なし"}
- スキルステータス: ${skillsText.join(" | ")}

## 2. 性格・内面構造
- 表向きの性格: ${getVal("publicFace")}
- 根底の倫理観・価値観: ${getVal("coreBelief")}
- 長所と短所(ギャップ): ${getVal("gap")}
- 自己評価・コンプレックス: ${getVal("complex")}
- モチベーション: ${getVal("motivation")}

## 3. 過去・背景とトラウマ
- 幼少期の環境: ${getVal("childEnv")}
- 人生の転機: ${getVal("turningPoint")}
- トラウマ・心の傷: ${getVal("trauma")}
- 感情爆発のトリガー: ${getVal("trigger")}

## 4. 人間関係と「境界線」
- 仲間へのスタンス: ${getVal("relParty")}
- ストレスの溜め込み方: ${getVal("stressType")}
- 衝突時の行動パターン: ${getVal("fightPattern")}

## 5. アナーキア適応度 & 日常の癖
- 文明への執着: ${getVal("glitterAffinity")}
- ストレス耐性: ${getVal("stressResist")}
- 現地イデオロギーへの反応: ${getVal("anarchiaReaction")}
- 思考の癖: ${getVal("habit")}
- 好き/嫌い: ${getVal("likesDislikes")}
- 人間らしい弱点: ${getVal("weakness")}

## 6. メモ
${getVal("memo")}
`.trim();

  navigator.clipboard.writeText(prompt).then(() => {
    alert("🤖 AIプロンプトをクリップボードにコピーしました！");
  });
}

document.querySelectorAll("input, textarea, select").forEach(el => {
  el.addEventListener("input", autoSaveCurrent);
});
</script>
